[[pages.sections]]
type = "feature_grid"
id = "overview"

[[pages.sections.features]]
title = "Commit, then reveal"
description = "Commitment::new draws a random 32-byte nonce and hashes the payload together with it into SHA256(payload || nonce). Only that digest crosses the wire first; the payload and nonce follow when the value is revealed."

[[pages.sections.features]]
title = "Verify without a trusted server"
description = "Commitment::verify recomputes the digest from a revealed payload and nonce and compares it with the commitment the peer already holds, so both sides reach the same accept or reject with no intermediary. Commitments are visible in hex through hash_hex for logs and messages."

[[pages.sections.features]]
title = "Serde on by default"
description = "The default serde feature derives Serialize and Deserialize on Commitment, so a commitment travels in whatever serde format the protocol already speaks. Build with default features off to leave serde out entirely."

[[pages.sections.features]]
title = "One struct, two calls"
description = "The library is a single file: a public Commitment holding payload, nonce and hash, plus the constructor and the verifier. There is no state to keep and nothing to configure, which keeps the scheme small enough for a dice roll between two peers."
